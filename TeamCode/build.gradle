apply plugin: 'com.android.application'

//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.

// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    compileSdk 35
    defaultConfig {
        minSdk 24
    }

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()
            systemProperty 'net.bytebuddy.experimental', 'true'
        }
    }
}

dependencies {
    implementation project(':FtcRobotController')

    // if migrating from FTCLib, remove: implementation "org.ftclib.ftclib:core:2.1.1"
    implementation "org.solverslib:core:0.3.5"

    // only if you use Pedro Pathing:
    implementation "org.solverslib:pedroPathing:0.3.5"

//    implementation "com.bylazar:fullpanels:1.0.5"
//    implementation "com.bylazar:camerastream:1.0.2"

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.2'

    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.14.2'
}

repositories {
    maven {
        url "https://repo.dairy.foundation/releases"
    }
}
